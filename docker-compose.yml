services:
  mongodb:
    image: mongo:7
    container_name: codeguardian-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codeguardian-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    build: ./ai-service
    container_name: codeguardian-ai-service
    restart: unless-stopped
    env_file:
      - path: ./ai-service/.env
        required: false
    ports:
      - "8000:8000"
    networks:
      - codeguardian-net

  backend:
    build: ./backend
    container_name: codeguardian-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - MONGO_URI=mongodb://mongodb:27017/codeguardian
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - codeguardian-net

  frontend:
    build: ./frontend
    container_name: codeguardian-frontend
    restart: unless-stopped
    environment:
      # Runs in the BROWSER, so it must be a host-reachable address (not the docker hostname 'backend')
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - codeguardian-net

volumes:
  mongo-data:

networks:
  codeguardian-net:
    driver: bridge
